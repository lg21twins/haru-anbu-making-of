<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하루안부 — How We Built It</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/min-sans@main/css/minsans.css">
  <style>
    :root{
      --blue:#2C7AFC; --green:#22C55E; --orange:#FB923C; --red:#EF4444;
      --dark:#080808;
      --border:rgba(255,255,255,.07);
      --font:'Montserrat','MinSans',sans-serif;
      --r:24px; --gap:20px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;letter-spacing:-.02em}
    html,body{height:100vh;overflow:hidden;font-family:var(--font);background:var(--dark);color:#fff;-webkit-font-smoothing:antialiased}

    .hero{position:fixed;inset:0;padding:20px;display:flex}
    .bento{flex:1;display:flex;gap:var(--gap)}

    .col-left{flex:6;display:flex;flex-direction:column;gap:var(--gap);transition:flex .5s cubic-bezier(.4,0,.2,1)}
    .col-right{flex:4;display:flex;flex-direction:column;gap:var(--gap);transition:flex .5s cubic-bezier(.4,0,.2,1)}
    .bento:has([data-side="left"]:hover)  .col-left  {flex:6.25}
    .bento:has([data-side="left"]:hover)  .col-right {flex:3.75}
    .bento:has([data-side="right"]:hover) .col-left  {flex:5.75}
    .bento:has([data-side="right"]:hover) .col-right {flex:4.25}

    [data-pos="lt"]{flex:5;transition:flex .5s cubic-bezier(.4,0,.2,1)}
    .row-lb{flex:5;display:flex;gap:var(--gap);transition:flex .5s cubic-bezier(.4,0,.2,1)}
    .col-left:has([data-pos="lt"]:hover)   [data-pos="lt"]{flex:5.35}
    .col-left:has([data-pos="lt"]:hover)   .row-lb        {flex:4.65}
    .col-left:has([data-pos^="lb"]:hover)  [data-pos="lt"]{flex:4.65}
    .col-left:has([data-pos^="lb"]:hover)  .row-lb        {flex:5.35}

    [data-pos="lbl"],[data-pos="lbr"]{flex:5;transition:flex .5s cubic-bezier(.4,0,.2,1)}
    .row-lb:has([data-pos="lbl"]:hover) [data-pos="lbl"]{flex:5.35}
    .row-lb:has([data-pos="lbl"]:hover) [data-pos="lbr"]{flex:4.65}
    .row-lb:has([data-pos="lbr"]:hover) [data-pos="lbl"]{flex:4.65}
    .row-lb:has([data-pos="lbr"]:hover) [data-pos="lbr"]{flex:5.35}

    [data-pos="rt"]{flex:7;transition:flex .5s cubic-bezier(.4,0,.2,1)}
    [data-pos="rb"]{flex:3;transition:flex .5s cubic-bezier(.4,0,.2,1)}
    .col-right:has([data-pos="rt"]:hover) [data-pos="rt"]{flex:7.3}
    .col-right:has([data-pos="rt"]:hover) [data-pos="rb"]{flex:2.7}
    .col-right:has([data-pos="rb"]:hover) [data-pos="rt"]{flex:6.7}
    .col-right:has([data-pos="rb"]:hover) [data-pos="rb"]{flex:3.3}

    /* CARD */
    .card{border-radius:var(--r);overflow:hidden;position:relative;padding:32px;display:flex;flex-direction:column;cursor:default;animation:up .5s ease both}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .card:nth-child(1){animation-delay:.04s}
    [data-pos="rt"] {animation-delay:.09s}
    [data-pos="lbl"]{animation-delay:.13s}
    [data-pos="lbr"]{animation-delay:.17s}
    [data-pos="rb"] {animation-delay:.21s}

    [data-pos="lt"] {background:#111}
    [data-pos="lbl"]{background:#161616;background-image:url('bento/스크린샷 2026-06-02 오전 12.44.28.png');background-size:210%;background-position:center;padding:0}
    [data-pos="lbr"]{background:var(--green)}
    [data-pos="rt"] {background:#f0f0f0;background-image:url('bento/KakaoTalk_Photo_2026-06-01-22-19-45.png');background-size:cover;background-position:right center;padding:0}
    [data-pos="rb"] {background:#111;border:1px solid var(--border)}

    /* Glow */
    .glow::after{content:'';position:absolute;inset:0;border-radius:var(--r);pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.055),transparent 40%);opacity:0;transition:opacity .3s}
    .glow:hover::after{opacity:1}

    /* TITLE CARD */
    .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.3);display:flex;align-items:center;gap:8px}
    .title-big{font-size:clamp(64px,7.5vw,120px);font-weight:800;line-height:.88;color:#fff}
    .title-dot{color:var(--green)}
    .title-sub{font-size:clamp(13px,1vw,16px);font-weight:400;color:rgba(255,255,255,.38);margin-top:12px;margin-bottom:24px}
    .title-foot{display:flex;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)}
    .title-year{font-size:11px;font-weight:500;text-transform:uppercase;color:rgba(255,255,255,.22)}
    .title-badge{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--green);background:rgba(34,197,94,.12);padding:5px 13px;border-radius:100px;border:1px solid rgba(34,197,94,.22)}

    /* LBL CARD */
    .lbl-haru{font-size:clamp(80px,11.5vw,160px);font-weight:900;line-height:.83;color:#fff;position:absolute;bottom:-8px;left:-3px;user-select:none;z-index:1}
    .lbl-anbu{font-size:clamp(80px,11.5vw,160px);font-weight:900;line-height:.83;color:#fff;position:absolute;bottom:-8px;right:-3px;user-select:none;z-index:1}
    .lbl-logo{position:absolute;bottom:clamp(52px,6.5vw,100px);right:clamp(52px,6.5vw,100px);width:72px;height:72px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:3}
    .lbl-cta-lbl{font-size:11px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.25)}
    .lbl-cta-title{font-size:clamp(18px,1.8vw,26px);font-weight:800;color:rgba(255,255,255,.85);margin-top:10px;line-height:1.15}
    .lbl-cta-btn{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:13px 22px;background:var(--green);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;border-radius:14px;text-decoration:none;transition:transform .2s,background .2s;align-self:flex-start;position:relative;z-index:2}
    .lbl-cta-btn:hover{background:#1db84f;transform:translateY(-2px)}
    .lbl-cta-arr{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;font-size:11px}

    /* LBR FLOAT SCENE */
    [data-pos="lbr"]{padding:0}
    .lbr-scene{position:absolute;inset:0;overflow:hidden}
    .ui-el{position:absolute;will-change:transform;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes flt-a{0%,100%{transform:translateY(0px)rotate(0deg)}40%{transform:translateY(-7px)rotate(.6deg)}75%{transform:translateY(3px)rotate(-.3deg)}}
    @keyframes flt-b{0%,100%{transform:translateY(0px)rotate(0deg)}35%{transform:translateY(-5px)rotate(-.5deg)}65%{transform:translateY(5px)rotate(.4deg)}}
    @keyframes flt-c{0%,100%{transform:translateY(0px)rotate(0deg)}50%{transform:translateY(-8px)rotate(.7deg)}}
    @keyframes flt-d{0%,100%{transform:translateY(0px)rotate(0deg)}45%{transform:translateY(-4px)rotate(-.6deg)}80%{transform:translateY(6px)rotate(.35deg)}}


    /* RB CARD */
    [data-pos="rb"]{padding:0}
    .rb-text-block{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
    .rb-row-top{display:flex;align-items:center;margin-left:-3px}
    .rb-haru{font-size:clamp(88px,12vw,170px);font-weight:900;line-height:.83;color:#fff;user-select:none;flex-shrink:0}
    .rb-logo{width:clamp(70px,9vw,130px);height:clamp(70px,9vw,130px);margin-left:calc(clamp(88px,12vw,170px)*-.08);flex-shrink:0;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
    .rb-anbu{font-size:clamp(88px,12vw,170px);font-weight:900;line-height:.83;color:#fff;user-select:none;align-self:flex-end;margin-right:-3px}

    /* CTA CARD */
    .cta-lbl{font-size:11px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.25)}
    .cta-title{font-size:clamp(18px,1.8vw,26px);font-weight:800;color:rgba(255,255,255,.85);margin-top:10px;line-height:1.15}
    .cta-btn{display:inline-flex;align-items:center;gap:9px;margin-top:auto;padding:13px 22px;background:var(--green);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;border-radius:14px;text-decoration:none;transition:transform .2s,background .2s;align-self:flex-start}
    .cta-btn:hover{background:#1db84f;transform:translateY(-2px)}
    .cta-arr{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;font-size:11px}

    @media(max-width:900px){
      html,body{height:auto;overflow:auto}
      .hero{position:static;padding:16px}
      .bento{flex-direction:column}
      .col-left,.col-right{flex:none;height:auto}
      .bento:has([data-side]:hover) .col-left,
      .bento:has([data-side]:hover) .col-right{flex:none}
      [data-pos="lt"],[data-pos="rt"],[data-pos="rb"]{flex:none;min-height:280px}
      .row-lb{flex:none;min-height:260px}
      [data-pos="lbl"],[data-pos="lbr"]{flex:1;min-height:0}
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="bento">

      <!-- LEFT COLUMN -->
      <div class="col-left">

        <!-- Left-Top: TITLE (5) -->
        <div class="card glow" data-pos="lt" data-side="left">
          <div class="title-big">How far<br>can we<br>push <span class="title-dot">AI?</span></div>
        </div>

        <!-- Left-Bottom: split 5:5 -->
        <div class="row-lb">

          <!-- Left-Bottom-Left: SCREENSHOT (5) -->
          <div class="card" data-pos="lbl" data-side="left"></div>

          <!-- Left-Bottom-Right: UI FLOAT (5) -->
          <div class="card" data-pos="lbr" data-side="left">
            <div class="lbr-scene">

              <!-- Care Platform label -->
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;user-select:none;z-index:0">
                <div style="font-size:clamp(26px,3.6vw,50px);font-weight:900;color:rgba(255,255,255,.22);text-align:center;line-height:1.05;letter-spacing:-.03em">Care<br>Platform</div>
              </div>

              <!-- 1. Daily Report -->
              <div class="ui-el" style="top:7%;left:4%;animation:flt-a 3.3s infinite;animation-delay:0s">
                <div style="background:linear-gradient(135deg,#3B82F6,#6366F1);border-radius:20px;padding:9px 16px;display:flex;align-items:center;gap:5px;box-shadow:0 5px 18px rgba(99,102,241,.42)">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z" fill="white" opacity=".95"/><path d="M19 2L19.8 4.2L22 5L19.8 5.8L19 8L18.2 5.8L16 5L18.2 4.2L19 2Z" fill="white" opacity=".7"/></svg>
                  <span style="font-size:12px;font-weight:700;color:#fff;white-space:nowrap">Daily Report</span>
                </div>
              </div>

              <!-- 2. Stable -->
              <div class="ui-el" style="top:5%;right:5%;animation:flt-b 3.7s infinite;animation-delay:-.7s">
                <div style="background:#fff;border-radius:20px;padding:9px 18px;box-shadow:0 5px 18px rgba(0,0,0,.13)">
                  <span style="font-size:13px;font-weight:800;color:#22C55E">Stable</span>
                </div>
              </div>

              <!-- 3. Meal Completed -->
              <div class="ui-el" style="top:24%;left:18%;animation:flt-c 4.1s infinite;animation-delay:-1.4s">
                <div style="background:#fff;border-radius:14px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 18px rgba(0,0,0,.12)">
                  <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#D1FAE5,#A7F3D0);flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12" stroke="#22C55E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <div style="position:absolute;bottom:0;right:0;width:6px;height:6px;border-radius:50%;background:#22C55E;border:1.5px solid #fff"></div>
                  </div>
                  <div>
                    <div style="font-size:10px;font-weight:700;color:#0F172A;white-space:nowrap">Meal Completed</div>
                    <div style="font-size:8px;color:rgba(0,0,0,.38);margin-top:1px">2 min ago</div>
                  </div>
                </div>
              </div>

              <!-- 4. Location pin -->
              <div class="ui-el" style="top:42%;left:5%;animation:flt-d 3.5s infinite;animation-delay:-2s">
                <div style="position:relative;width:36px;height:42px">
                  <div style="width:34px;height:34px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,#60A5FA,#3B82F6);transform:rotate(-45deg);box-shadow:0 5px 16px rgba(59,130,246,.42)"></div>
                  <div style="position:absolute;top:6px;left:6px;width:22px;height:22px;display:flex;align-items:center;justify-content:center">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M3 9.4L12 3L21 9.4V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V9.4Z"/></svg>
                  </div>
                </div>
              </div>

              <!-- 5. Morning Walk chip -->
              <div class="ui-el" style="top:52%;left:24%;animation:flt-a 4.3s infinite;animation-delay:-2.6s">
                <div style="background:rgba(255,255,255,.92);border-radius:20px;padding:7px 7px 7px 14px;display:flex;align-items:center;gap:8px;border:1.5px solid rgba(13,148,136,.2)">
                  <span style="font-size:11px;font-weight:700;color:#0D9488;white-space:nowrap">Morning Walk</span>
                  <div style="width:18px;height:18px;border-radius:50%;background:#F43F5E;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(244,63,94,.35)">
                    <svg width="8" height="8" viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18" stroke="white" stroke-width="2.8" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="white" stroke-width="2.8" stroke-linecap="round"/></svg>
                  </div>
                </div>
              </div>

              <!-- 6. Blue checkbox -->
              <div class="ui-el" style="top:38%;right:5%;animation:flt-b 3.9s infinite;animation-delay:-1.8s">
                <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 16px rgba(59,130,246,.42)">
                  <svg width="18" height="18" viewBox="0 0 28 28" fill="none"><polyline points="5,14 11,20 23,8" stroke="white" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
              </div>

              <!-- 7. Hospital Visit -->
              <div class="ui-el" style="bottom:7%;left:4%;animation:flt-c 3.8s infinite;animation-delay:-3.1s">
                <div style="background:#fff;border-radius:14px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:9px;box-shadow:0 5px 18px rgba(0,0,0,.12)">
                  <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#EFF6FF,#DBEAFE);display:flex;align-items:center;justify-content:center;flex-shrink:0">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="3" stroke="#3B82F6" stroke-width="2"/><path d="M16 2V6M8 2V6M3 10H21" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/><path d="M12 13V17M10 15H14" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/></svg>
                  </div>
                  <div>
                    <div style="font-size:8px;font-weight:700;color:#3B82F6;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px">Today</div>
                    <div style="font-size:11px;font-weight:800;color:#0F172A;white-space:nowrap">Hospital Visit</div>
                    <div style="font-size:8px;color:rgba(0,0,0,.38);margin-top:1px">2:00 PM</div>
                  </div>
                </div>
              </div>

              <!-- 8. All Good -->
              <div class="ui-el" style="bottom:8%;right:5%;animation:flt-d 4.2s infinite;animation-delay:-.4s">
                <div style="background:#fff;border-radius:20px;padding:8px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 5px 18px rgba(0,0,0,.11)">
                  <div style="position:relative;width:8px;height:8px;flex-shrink:0">
                    <div style="position:absolute;inset:0;border-radius:50%;background:#22C55E;opacity:.3;transform:scale(2)"></div>
                    <div style="position:absolute;inset:1.5px;border-radius:50%;background:#22C55E"></div>
                  </div>
                  <span style="font-size:12px;font-weight:800;color:#0F172A;white-space:nowrap">All Good</span>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-right">

        <!-- Right-Top: IMAGE (7) -->
        <div class="card" data-pos="rt" data-side="right"></div>

        <!-- Right-Bottom: STACKED TYPE (3) -->
        <div class="card" data-pos="rb" data-side="right">
          <div class="rb-text-block">
            <div class="rb-row-top">
              <div class="rb-haru">HARU</div>
              <div class="rb-logo">
                <svg width="52%" height="52%" viewBox="0 0 2526 2526" fill="#fff">
                  <path d="M2521.32 2506.66C1239.65 2657.48 1239.65 1895.6 1239.65 1279.34L2497.69 0C2518.68 494.198 2522.27 1157.92 1658.86 1262.48C2641.88 1314.25 2521.32 2101.84 2521.32 2506.66Z"/>
                  <path d="M4.677 19.335C1286.35-131.481 1286.35 630.399 1286.35 1246.66L28.315 2526C7.322 2031.8 3.73 1368.08 867.143 1263.52C-115.881 1211.75 4.677 424.157 4.677 19.335Z"/>
                </svg>
              </div>
            </div>
            <div class="rb-anbu">ANBU</div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script>
    /* Glow */
    document.querySelectorAll('.glow').forEach(c => {
      c.addEventListener('mousemove', e => {
        const r = c.getBoundingClientRect();
        c.style.setProperty('--mx', (e.clientX - r.left) / r.width * 100 + '%');
        c.style.setProperty('--my', (e.clientY - r.top) / r.height * 100 + '%');
      });
    });


  </script>
</body>
</html>
